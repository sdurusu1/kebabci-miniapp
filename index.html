<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KEBABCI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">📊</span>
      <div>
        <h1>KEBABCI</h1>
        <small>İstatistik Analiz</small>
      </div>
    </div>
    <div id="subStatus" class="badge">Abonelik</div>
  </header>

  <div class="controls">
    <input id="search" type="search" placeholder="Takım, lig, skor..." oninput="filter()">
    <button onclick="reload()">🔄</button>
    <button onclick="toggleSort()">⇅</button>
  </div>

  <div class="quick">
    <button onclick="quick('Süper')">Süper Lig</button>
    <button onclick="quick('Premier')">Premier</button>
    <button onclick="quick('La Liga')">La Liga</button>
    <button onclick="quick('Serie')">Serie A</button>
    <button onclick="quick('Bundes')">Bundesliga</button>
    <button onclick="quick('high')">Yüksek %</button>
    <button onclick="clearAll()">Temizle</button>
  </div>

  <div id="summary" class="summary"></div>
  <div id="matches"></div>

  <div id="sheet" class="sheet" onclick="closeSheet()">
    <div class="sheet-body" onclick="event.stopPropagation()"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
