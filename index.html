<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEBABCI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { margin:0; background:#000; color:#fff; font-family:-apple-system,system-ui; padding:12px; }
h2 { margin:0 0 8px; }
select, input, button { background:#1c1c1e; color:#fff; border:none; border-radius:8px; padding:8px; margin:3px; }
button { background:#0a84ff; }
.card { background:#1c1c1e; border-radius:12px; padding:12px; margin:8px 0; cursor:pointer; }
.score { font-weight:700; font-size:15px; }
.high { color:#30d158; } .mid { color:#ffd60a; } .low { color:#ff453a; }
.small { font-size:12px; color:#8e8e93; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); align-items:flex-end; }
.modal.show { display:flex; }
.panel { background:#1c1c1e; width:100%; border-radius:16px 16px 0 0; padding:16px; max-height:80vh; overflow:auto; }
</style>
</head>
<body>
<h2>📊 KEBABCI</h2>
<select id="day"></select>
<select id="league"><option value="">Tüm Ligler</option></select>
<input id="search" placeholder="Takım ara...">
<div>
  <button onclick="start()">Yenile</button>
  <button onclick="filter('all')">Tümü</button>
  <button onclick="filter('high')">≥65%</button>
  <button onclick="filter('fav')">Favoriler</button>
  <button onclick="sortToggle()">Sırala</button>
</div>
<div id="out"></div>

<div id="modal" class="modal" onclick="closeModal()">
  <div class="panel" onclick="event.stopPropagation()" id="panel"></div>
</div>
<script src="app.js"></script>
</body>
</html>
