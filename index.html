<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KEBABCI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="hero-top">
        <div class="logo-box">📊</div>
        <div>
          <h1>KEBABCI</h1>
          <div class="subtitle">İstatistik Analiz Platformu</div>
        </div>
        <div id="liveBadge" class="live">CANLI</div>
      </div>
      <div class="hero-stats">
        <div><b id="totalMatches">-</b><small>Maç</small></div>
        <div><b id="highConf">-</b><small>Yüksek</small></div>
        <div><b id="avgPct">-</b><small>Ort. %</small></div>
      </div>
    </div>

    <div class="segment">
      <button class="seg active" data-tab="all">Tümü</button>
      <button class="seg" data-tab="high">Yüksek Güven</button>
      <button class="seg" data-tab="fav">Favorilerim</button>
      <button class="seg" data-tab="live">Canlı</button>
    </div>

    <div class="search-wrap">
      <input id="searchInput" placeholder="Takım, lig veya skor ara...">
      <button id="clearSearch">✕</button>
    </div>

    <div class="league-scroll" id="leagueScroll"></div>

    <div id="matchList"></div>
  </div>

  <div id="bottomSheet" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div id="sheetContent"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
