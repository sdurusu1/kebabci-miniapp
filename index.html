<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KEBABCI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="top">
      <div class="logo">📊</div>
      <div>
        <h1>KEBABCI</h1>
        <p>İstatistik Analiz</p>
      </div>
    </div>
    <div id="sub" class="sub">Abonelik durumu yükleniyor...</div>
  </header>

  <div class="search-bar">
    <input id="q" type="search" placeholder="Takım, lig veya skor ara..." oninput="applyFilters()">
    <button onclick="loadData()" title="Yenile">🔄</button>
  </div>

  <div class="filters">
    <button class="chip active" onclick="setLeague('')">Tümü</button>
    <button class="chip" onclick="setLeague('Süper')">Süper Lig</button>
    <button class="chip" onclick="setLeague('Premier')">Premier</button>
    <button class="chip" onclick="setLeague('La Liga')">La Liga</button>
    <button class="chip" onclick="setLeague('Serie')">Serie A</button>
    <button class="chip" onclick="setLeague('Bundes')">Bundesliga</button>
  </div>

  <div class="stats" id="stats"></div>
  <div id="list"></div>
  <div id="modal" class="modal" onclick="closeModal()"></div>

  <script src="app.js"></script>
</body>
</html>
