<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEBABCI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { margin:0; background:#000; color:#fff; font-family:-apple-system,system-ui; padding:12px; }
h2 { margin:0 0 8px; font-size:18px; }
select, input { background:#1c1c1e; color:#fff; border:none; border-radius:8px; padding:8px; margin:4px 0; width:100%; }
button { background:#0a84ff; color:#fff; border:none; border-radius:8px; padding:6px 10px; margin:3px; }
.card { background:#1c1c1e; border-radius:12px; padding:12px; margin:8px 0; }
.score { font-size:16px; font-weight:700; color:#30d158; }
.small { font-size:12px; color:#8e8e93; }
</style>
</head>
<body>
<h2>📊 KEBABCI</h2>
<select id="day"></select>
<select id="league"><option value="">Tüm Ligler</option></select>
<input id="search" placeholder="Takım ara...">
<div>
  <button onclick="filter('all')">Tümü</button>
  <button onclick="filter('high')">≥65%</button>
  <button onclick="filter('fav')">Favoriler</button>
</div>
<div id="out"></div>
<script src="app.js"></script>
</body>
</html>
