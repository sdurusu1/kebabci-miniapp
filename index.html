<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEBABCI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:-apple-system,system-ui;padding:12px}
h2{margin:0 0 6px;font-size:18px}
.summary{background:#1c1c1e;border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px}
select,input,button{background:#1c1c1e;color:#fff;border:0;border-radius:8px;padding:7px 9px;margin:3px;font-size:13px}
button{background:#0a84ff}
.card{background:#1c1c1e;border-radius:12px;padding:12px;margin:8px 0}
.score{font-weight:700}.high{color:#30d158}.mid{color:#ffd60a}.low{color:#ff453a}
.small{font-size:12px;color:#8e8e93}
.risk{font-size:11px;padding:2px 6px;border-radius:6px;margin-left:6px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);align-items:flex-end;z-index:10}
.modal.show{display:flex}
.panel{background:#1c1c1e;width:100%;border-radius:16px 16px 0 0;padding:16px;max-height:85vh;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
</style>
</head>
<body>
<h2>📊 KEBABCI</h2>
<div class="summary" id="summary">Yükleniyor...</div>
<select id="day"></select>
<select id="league"><option value="">Tüm Ligler</option></select>
<input id="search" placeholder="Takım ara...">
<div class="row">
  <button onclick="start()">Yenile</button>
  <button onclick="filter('all')">Tümü</button>
  <button onclick="filter('high')">≥65%</button>
  <button onclick="filter('top3')">En Güvenli 3</button>
  <button onclick="filter('surprise')">Sürpriz</button>
  <button onclick="filter('over')">2.5 Üst</button>
  <button onclick="filter('btts')">KG Var</button>
  <button onclick="filter('low')">Düşük Tempo</button>
  <button onclick="filter('fav')">Favoriler</button>
</div>
<div id="count" class="small"></div>
<div id="out"></div>
<div id="modal" class="modal" onclick="closeModal()"><div class="panel" id="panel" onclick="event.stopPropagation()"></div></div>
<script src="app.js"></script>
</body>
</html>
